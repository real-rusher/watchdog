name: launch-test
on:
  push:
    paths: [.github/workflows/launch-test.yml, .github/launch-test.sh]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Realistic depot in the default location
        working-directory: Core
        run: |
          swift build -c release --product watchdog-cli > /dev/null 2>&1
          "$(swift build -c release --show-bin-path)/watchdog-cli" write-example "$HOME/Documents/Watchdog/Watchdog.json"
      - name: Install and start released versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          bash .github/launch-test.sh v1.0.4 v1.0.5 > out/launch.txt 2>&1 || true
          cp run.log out/ 2>/dev/null || true
      - name: Publish results
        if: always()
        run: |
          cd out && git init -q -b r && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "launch ${{ matrix.os }} ${GITHUB_SHA::7}" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r:results-launch-${{ matrix.os }}
