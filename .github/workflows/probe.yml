name: probe-apis
on:
  workflow_dispatch:
  push:
    paths: [scripts/probe*.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && python3 scripts/probe2.py > out/probe2-${{ matrix.os }}.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}
          path: out
  publish:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: |
          cd out && git init -q -b r && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm results && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r:probe-results
