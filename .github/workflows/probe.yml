name: probe-apis
on:
  workflow_dispatch:
  push:
    paths: [scripts/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && python3 scripts/probe.py > out/probe.txt 2>&1 || true
      - name: Publish results to ci-results branch
        if: always()
        run: |
          cd out
          git init -q -b ci-results
          git config user.name "watchdog-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "probe results ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results:probe-results
