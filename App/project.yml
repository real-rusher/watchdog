name: Watchdog
options:
  bundleIdPrefix: de.realrusher
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
packages:
  WatchdogCore:
    path: ../Core
targets:
  Watchdog:
    type: application
    platform: macOS
    sources:
      - path: Watchdog
        excludes:
          - "Resources/Fonts/OFL.txt"
    dependencies:
      - package: WatchdogCore
        product: WatchdogCore
    info:
      path: Watchdog/Info.plist
      properties:
        CFBundleDisplayName: Watchdog
        CFBundleName: Watchdog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Watchdog. Schrift IBM Plex (SIL Open Font License)."
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.realrusher.watchdog
        PRODUCT_NAME: Watchdog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Watchdog:
    build:
      targets:
        Watchdog: all
    run:
      config: Debug
    archive:
      config: Release
